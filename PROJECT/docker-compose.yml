services:
  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped
    networks:
      - networkName
    entrypoint:
      - /bin/sh
      - -c
      - |
        ollama serve &
        # Wait for server to be ready
        until ollama list > /dev/null 2>&1; do
          echo "Waiting for Ollama server..."
          sleep 2
        done
        echo "Pulling model qwen2.5:3b..."
        ollama pull qwen2.5:3b
        echo "Model pulled. Server is ready."
        wait

  server:
    build: .
    ports:
      - "8001:8001"
    volumes:
      - .:/app
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    networks:
      - networkName

volumes:
  ollama:

networks:
  networkName:
    driver: bridge